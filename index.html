<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>다양한 자료 추출 및 변환</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 40px 20px; 
      max-width: 580px; 
      margin: 0 auto; 
      line-height: 1.5; 
      color: #333; 
      background-color: #f8f9fa; 
    }
    
    .tab-header { display: flex; gap: 6px; margin-bottom: 20px; }
    .tab-btn { 
      flex: 1; 
      padding: 12px 6px; 
      border: 1px solid #ced4da; 
      background: #e9ecef; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 13px; 
      cursor: pointer; 
      color: #495057; 
      transition: all 0.2s; 
      text-align: center;
      white-space: nowrap;
    }
    .tab-btn.active { background: #0056b3; color: white; border-color: #0056b3; }

    /* iframe 영역 지정 */
    .module-frame {
      width: 100%;
      min-height: 550px; /* 기본 최소 높이 보장 */
      border: none;
      border-radius: 16px;
      background: transparent;
      display: block;
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="tab-header">
    <button class="tab-btn active" onclick="switchTab('webpTab', this)">WebP 변환</button>
    <button class="tab-btn" onclick="switchTab('upscaleTab', this)">이미지 업스케일</button>
    <button class="tab-btn" onclick="switchTab('ytEachTab', this)">유튜브 영상 추출</button>
    <button class="tab-btn" onclick="switchTab('ytBatchTab', this)">유튜브 썸네일 추출</button>
  </div>

  <!-- [탭 1] WebP 변환 -->
  <div id="webpTab" class="tab-content active">
    <iframe src="webp2mp4.html" id="webpFrame" class="module-frame"></iframe>
  </div>

  <!-- [탭 2] 이미지 업스케일링 (지연 로딩) -->
  <div id="upscaleTab" class="tab-content">
    <iframe data-src="upscale.html" id="upscaleFrame" class="module-frame"></iframe>
  </div>

  <!-- [탭 3] 유튜브 영상 추출 (지연 로딩) -->
  <div id="ytEachTab" class="tab-content">
    <iframe data-src="yt_download_each.html" id="ytEachFrame" class="module-frame"></iframe>
  </div>

  <!-- [탭 4] 유튜브 썸네일 추출 (지연 로딩) -->
  <div id="ytBatchTab" class="tab-content">
    <iframe data-src="yt_downloader.html" id="ytBatchFrame" class="module-frame"></iframe>
  </div>

  <script>
    function switchTab(tabId, btnEl) {
      // 모든 탭 숨기기
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      // 선택한 탭 활성화
      const activeTab = document.getElementById(tabId);
      activeTab.classList.add('active');
      btnEl.classList.add('active');

      // 지연 로딩(Lazy Load): 탭을 클릭하는 시점에 iframe src 등록
      const iframe = activeTab.querySelector('iframe');
      if (iframe && !iframe.getAttribute('src')) {
        iframe.setAttribute('src', iframe.getAttribute('data-src'));
      }
    }

    // 자식 iframe 높이에 맞춰 dynamic resize
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'resize_iframe') {
        const frames = document.querySelectorAll('.module-frame');
        frames.forEach(frame => {
          if (frame.contentWindow === event.source && event.data.height > 0) {
            frame.style.height = `${event.data.height}px`;
          }
        });
      }
    });
  </script>
</body>
</html>
